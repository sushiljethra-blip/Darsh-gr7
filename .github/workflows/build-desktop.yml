name: Build Windows EXE

on:
  push:
    branches:
      - claude/sip-phone-dialer-auto-dial-OzKmr
    paths:
      - 'sip-dialer-app/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "pyvoip>=1.6.4" "sounddevice>=0.4.6" "numpy>=1.24.0" pyinstaller

      - name: Build EXE
        shell: bash
        working-directory: sip-dialer-app
        run: |
          python -m PyInstaller \
            --onefile \
            --windowed \
            --name "BPO-SIP-Dialer" \
            --collect-all pyvoip \
            --collect-all sounddevice \
            --copy-metadata pyvoip \
            --hidden-import pyvoip \
            --hidden-import pyvoip.voip \
            --hidden-import pyvoip.call \
            --hidden-import pyvoip.rtp \
            --hidden-import pyvoip.sip \
            --hidden-import audioop \
            --hidden-import sounddevice \
            --hidden-import numpy \
            --hidden-import _cffi_backend \
            main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BPO-SIP-Dialer-Windows
          path: sip-dialer-app/dist/BPO-SIP-Dialer.exe
          retention-days: 30
